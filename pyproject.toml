[project]
name = "tensorlite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "edanielo", email = "edanielocamportiz@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
]

[project.scripts]
tensorlite = "tensorlite:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
